name: PantryOrbit
options:
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.1'
    CURRENT_PROJECT_VERSION: 3
    GENERATE_INFOPLIST_FILE: 'YES'
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
    CODE_SIGN_STYLE: Automatic
targets:
  PantryOrbit:
    type: application
    platform: iOS
    sources:
    - App
    - Shared
    - SharedCatalog
    - Brand
    info:
      path: App/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: IcePantryOrbit
        NSCameraUsageDescription: Scan a package barcode to find the product in Open Food Facts.
        CFBundleURLTypes:
        - CFBundleURLSchemes:
          - pantryorbit
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/PantryOrbit.entitlements
      properties:
        com.apple.security.application-groups:
        - group.app.pantryorbit.store
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pantryorbit.store
        TARGETED_DEVICE_FAMILY: 1,2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
    dependencies:
    - target: PantryOrbitWidget
      embed: true
  PantryOrbitWidget:
    type: app-extension
    platform: iOS
    sources:
    - Widget
    - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Use First
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/PantryOrbitWidget.entitlements
      properties:
        com.apple.security.application-groups:
        - group.app.pantryorbit.store
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pantryorbit.store.widget
        SKIP_INSTALL: 'YES'
        APPLICATION_EXTENSION_API_ONLY: 'YES'
  PantryOrbitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - UITests
    dependencies:
    - target: PantryOrbit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pantryorbit.store.ui-tests
        TEST_TARGET_NAME: PantryOrbit
  PantryOrbitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - Tests
    dependencies:
    - target: PantryOrbit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
        PRODUCT_BUNDLE_IDENTIFIER: app.pantryorbit.store.tests
schemes:
  PantryOrbit:
    build:
      targets:
        PantryOrbit: all
        PantryOrbitUITests:
        - test
    test:
      targets:
      - PantryOrbitTests
      - PantryOrbitUITests
